services:
  app:
    build: .
    expose:
      - "8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
    deploy:
      replicas: 3
    depends_on:
      - postgres
      - redis
      - kafka

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - app
